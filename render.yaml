databases:
  - name: reposeance-db
    databaseName: reposeance
    user: reposeance
    plan: 0.5c-1g
    diskSizeGB: 5
    postgresMajorVersion: "15"
    region: singapore

services:
  - type: pserv
    name: reposeance-ollama
    runtime: docker
    plan: 2c-4g
    region: singapore
    dockerfilePath: ./infra/ollama/Dockerfile
    dockerContext: .
    disk:
      name: reposeance-models
      mountPath: /var/lib/ollama
      sizeGB: 10
    envVars:
      - key: OLLAMA_HOST
        value: 0.0.0.0:11434
      - key: OLLAMA_MODELS
        value: /var/lib/ollama
      - key: OLLAMA_MODEL
        value: gemma2:2b
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text

  - type: web
    name: reposeance-api
    runtime: python
    rootDir: apps/api
    plan: 1c-2g
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: reposeance-repositories
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: reposeance-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
      - key: OLLAMA_HOST
        fromService:
          name: reposeance-ollama
          type: pserv
          property: hostport
      - key: OLLAMA_MODEL
        value: gemma2:2b
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: GHOSTTRACE_ENABLED
        value: "true"
      - key: GHOSTTRACE_PROJECT_SCOPE_ONLY
        value: "true"
      - key: CORS_ORIGINS
        value: https://reposeance-web.onrender.com,http://localhost:3000,http://127.0.0.1:3000

  - type: web
    name: reposeance-web
    runtime: node
    rootDir: apps/web
    plan: 0.5c-512mb
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm exec next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_API_URL
        value: https://reposeance-api.onrender.com
