[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosttrace-cli"
version = "0.1.0"
description = "GhostTrace terminal companion — deterministic shell safety classifications via the Repo Séance API."
requires-python = ">=3.8"
dependencies = [
    "colorama>=0.4.6",
    "websockets>=10.0",
]

[project.scripts]
ghosttrace = "ghosttrace_cli.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghosttrace_cli*"]
